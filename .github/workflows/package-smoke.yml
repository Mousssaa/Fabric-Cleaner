name: CI - Package Smoke Tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - '.nvmrc'
      - 'electron-builder.yml'
      - 'electron-builder.arm64.yml'
      - 'electron.vite.config.ts'
      - 'tsconfig*.json'
      - 'src/**'
      - 'rules/**'
      - 'resources/**'
      - 'patches/**'
      - 'scripts/**'
      - '.github/workflows/**'
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Source ref to validate for release recovery
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: package-smoke-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  package:
    name: Packaged App (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            # The smoke executable must start unattended without a UAC prompt.
            args: --win --x64 -c.nsis.runAfterFinish=false -c.nsis.createDesktopShortcut=false -c.nsis.createStartMenuShortcut=false -c.appId=com.haktrak.fabric-cleaner.package-smoke
            executable: dist/win-unpacked/Fabric Cleaner.exe
          - os: ubuntu-latest
            args: --dir --linux --x64
            executable: dist/linux-unpacked/fabric-cleaner
          - os: macos-latest
            args: --mac dir --arm64 -c.mac.notarize=false -c.mac.identity=null
            executable: dist/mac-arm64/Fabric Cleaner.app/Contents/MacOS/Fabric Cleaner
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Package without signing or publishing
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --publish never ${{ matrix.args }}
      - name: Verify packaged resources, native modules, and CLI
        run: node scripts/package-smoke-test.js "${{ matrix.executable }}"
        timeout-minutes: 5
      - name: Verify Windows installer, update channel, and portable ZIP
        if: runner.os == 'Windows'
        run: node scripts/windows-package-smoke-test.js
        timeout-minutes: 5
