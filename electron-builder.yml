appId: com.haktrak.fabric-cleaner
productName: Fabric Cleaner
# Fabric Cleaner is built on Kudu (MIT, Copyright (c) 2026 Advent Development Inc).
# The upstream notice is kept in LICENSE and shipped with every build.
copyright: Copyright © 2026 HakTrak Networks. Portions Copyright © 2026 Advent Development Inc.

directories:
  buildResources: resources
  output: dist

files:
  - out/**/*

# Archive a separate copy so the portable marker never enters the installer.
afterAllArtifactBuild: scripts/build-portable-zip.js

extraResources:
  - from: resources/icon.ico
    to: icon.ico
    filter:
      - "**/*"
  - from: resources/icon.png
    to: icon.png
    filter:
      - "**/*"
  - from: resources/icons
    to: icons
    filter:
      - "**/*"
  # Bundled local YARA-X rule pack (no rules are ever downloaded).
  - from: resources/yara-rules
    to: yara-rules
    filter:
      - "**/*.yar"
  - from: LICENSE
    to: LICENSE.txt

win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  icon: resources/icon.ico
  # Least privilege: the app runs as the invoking user. Privileged features
  # request elevation on demand (UAC) through the elevation relaunch flow.
  requestedExecutionLevel: asInvoker

nsis:
  oneClick: true
  # Per-machine install into Program Files (not user-writable), so the binary
  # cannot be swapped by an unprivileged process. The installer elevates once;
  # the installed app itself runs asInvoker.
  perMachine: true
  allowToChangeInstallationDirectory: false
  deleteAppDataOnUninstall: false
  shortcutName: Fabric Cleaner
  artifactName: Fabric-Cleaner-Setup-${version}.${ext}

portable:
  artifactName: Fabric-Cleaner-Portable-${version}.${ext}
  requestExecutionLevel: user

mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  icon: resources/icon.png
  category: public.app-categories.utilities
  hardenedRuntime: true
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
  notarize: true
  artifactName: Fabric-Cleaner-${version}-${arch}.${ext}

linux:
  target:
    - target: AppImage
      arch:
        - x64
        - arm64
    - target: deb
      arch:
        - x64
        - arm64
  icon: resources/icons/
  category: Utility

# Stable AppImage name so electron-updater overwrites in place (#401).
# A versioned basename makes doInstall delete the old file and write a new
# name, leaving desktop/menu Exec= paths pointing at a missing binary.
appImage:
  artifactName: Fabric-Cleaner-${arch}.${ext}

deb:
  artifactName: Fabric-Cleaner-${version}-${arch}.${ext}
  depends:
    - libgtk-3-0
    - libnss3
    - libxss1
    - libasound2 | libasound2t64
    - libgbm1
    - libfuse2 | libfuse2t64
  afterInstall: scripts/deb-postinstall.sh

publish:
  provider: github
  releaseType: release
